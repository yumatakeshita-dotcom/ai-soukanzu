<title>Xポスト翻訳解説</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 左に原文、右に訳と解説を並べる作業机。狭い画面では上下に積む。 */
:root{
  --bg:#f4f5f2; --panel:#ffffff; --fg:#1b2420; --muted:#5d6a63; --line:#d9ddd6;
  --accent:#0d6b57; --accent-fg:#ffffff; --warn-bg:#fff4dc; --warn-fg:#6b4a00; --warn-line:#e9cf8f;
  --sans:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#1b231f; --fg:#e8ede9; --muted:#9aa8a0; --line:#2e3933;
  --accent:#4fc9a8; --accent-fg:#0b1511; --warn-bg:#2d2610; --warn-fg:#f0d88a; --warn-line:#5b4a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#1b231f; --fg:#e8ede9; --muted:#9aa8a0; --line:#2e3933;
  --accent:#4fc9a8; --accent-fg:#0b1511; --warn-bg:#2d2610; --warn-fg:#f0d88a; --warn-line:#5b4a16; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.8 var(--sans);padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;line-height:1.4;margin:0;font-weight:700;text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
label{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:14px/1.7 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
textarea{min-height:230px;resize:vertical}
textarea:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button{font:500 14px/1 var(--sans);padding:11px 16px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
.tag{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.06em;padding:4px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted);margin-bottom:10px}
.sec{padding:14px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:0}
.sec h2{font-size:13px;margin:0 0 6px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.sec p,.sec li{margin:0;font-size:15px}
.sec ul,.sec ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.term b{font-weight:700}
.warn{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);border-radius:4px;padding:10px 12px;font-size:14px}
.hist{display:flex;flex-direction:column}
.hitem{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hitem:first-child{border-top:0}
.hitem .hbody{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font:14px/1.6 var(--sans);color:var(--fg);cursor:pointer}
.hitem .hbody small{display:block;font:11px/1.4 var(--mono);color:var(--muted)}
.hitem .hbody span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .hdel{padding:6px 10px;font-size:12px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:1.5em}
.err{color:var(--warn-fg)}
</style>

<div class="wrap">
  <header>
    <h1>Xポスト翻訳解説</h1>
    <p class="lead">英語(中国語なども)のAIの新しい話題を貼ると、日本語訳と「何がすごいか・どう試すか」を返します。</p>
  </header>

  <div class="cols">
    <section class="panel" aria-label="入力">
      <label for="src">原文を貼る</label>
      <textarea id="src" placeholder="Xの投稿の本文を、そのまま貼ってください。長い記事の冒頭でも使えます。"></textarea>
      <div class="row">
        <button id="go" class="main" type="button">訳して解説する</button>
        <button id="sample" type="button">見本を入れる</button>
        <button id="clear" type="button">消す</button>
      </div>
      <label for="note" style="margin-top:16px">知りたいこと(あれば)</label>
      <input id="note" type="text" placeholder="例: 初心者でも試せる?料金はかかる?">
      <p class="hint">リンクだけ貼っても中身は読めません。本文をコピーして貼ってください。投稿の主張が正しいかは、確かめていないものは「未確認」と書き分けます。</p>
    </section>

    <section class="panel" aria-live="polite" aria-label="結果">
      <div id="status" class="status">結果がここに出ます。</div>
      <div id="out"></div>
    </section>
  </div>

  <section class="panel" id="histPanel" aria-label="保存した結果" hidden>
    <label>保存した結果(自分だけに見えます)</label>
    <div id="hist" class="hist"><p class="hint">まだありません。訳すと、ここに自動で残ります。</p></div>
  </section>
</div>

<script>
const SAMPLE = {
  text: `This is f*cking insane. Anthropic engineer:\n\n"Prompting is basically over\n\n95% of our engineers already run self-improving loops. The next move is graphs"\n\nIn just 10 minutes, she builds her entire Claude Code setup live, straight from an empty terminal\n\nEmpty Terminal → Agents → Loops → Graphs → Self-Improving System\n\nPrompting was the old way. Engineering the system around the model is the new one\n\nSave it and watch it today\n\nthen read the article below ↓`,
  result: {
    translation: "とんでもない。Anthropicのエンジニアいわく「プロンプトを書く時代はほぼ終わった。うちのエンジニアの95%はすでに、自分で改善していくループを動かしている。次はグラフだ」。彼女は10分で、空のターミナルから自分のClaude Code環境をその場で作り上げる。空のターミナル → エージェント → ループ → グラフ → 自己改善するシステム。プロンプトは古いやり方で、モデルの周りの仕組みを作ることが新しいやり方。保存して今日見て、そのあと下の記事を読もう。",
    summary: "うまい指示文を書くより、AIが自分で動き、自分でチェックし、直し続ける仕組みを作るほうが大事だ、という主張です。",
    terms: [
      {word:"ループ", meaning:"AIが「実行→確認→直す」を繰り返す仕組み"},
      {word:"グラフ", meaning:"複数の作業や担当のAIを線でつないだ、作業の流れ図"},
      {word:"エージェント", meaning:"自分で作業を進めるAI"},
      {word:"Claude Code", meaning:"ターミナルで動く、Anthropicのコーディング用AI"}
    ],
    why: ["人が1手ずつ見張らなくても、最後の結果だけ確認すればよい形にできる","同じ型で、コード以外の作業(調べもの、資料づくり)にも使える"],
    howto: ["動画と、引用されている記事を読む","今やっている小さな作業を1つ選ぶ","「やる→確認する→直す」を1つのループにして、AIに回させる","人が見るのは最後の結果だけにする"],
    caution: "「Anthropicのエンジニア」と「95%」は投稿者の言い分で、本文だけでは確かめられません。同じ型の投稿が別の人物名で繰り返し出ていることもあるため、公式の出典を探してから信じてください。"
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastText = "";

function render(r, isSample){
  const list = (a, tag) => a && a.length ? `<${tag}>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</${tag}>` : "<p>なし</p>";
  const terms = (r.terms||[]).map(t=>`<li class="term"><b>${esc(t.word)}</b>: ${esc(t.meaning)}</li>`).join("");
  $("out").innerHTML = `
    ${isSample ? '<span class="tag">見本(2026-11-21の投稿)</span>' : ''}
    <div class="sec"><h2>日本語訳</h2><p>${esc(r.translation)}</p></div>
    <div class="sec"><h2>ひとことで</h2><p>${esc(r.summary)}</p></div>
    <div class="sec"><h2>ことばの意味</h2>${terms ? `<ul>${terms}</ul>` : "<p>なし</p>"}</div>
    <div class="sec"><h2>何がすごいか</h2>${list(r.why,"ul")}</div>
    <div class="sec"><h2>どう試すか</h2>${list(r.howto,"ol")}</div>
    <div class="sec"><div class="warn"><b>未確認の点:</b> ${esc(r.caution)}</div></div>
    <div class="row"><button id="copy" type="button">結果をコピー</button></div>`;
  lastText = `【日本語訳】\n${r.translation}\n\n【ひとことで】\n${r.summary}\n\n【ことば】\n${(r.terms||[]).map(t=>`・${t.word}: ${t.meaning}`).join("\n")}\n\n【何がすごいか】\n${(r.why||[]).map(x=>`・${x}`).join("\n")}\n\n【どう試すか】\n${(r.howto||[]).map((x,i)=>`${i+1}. ${x}`).join("\n")}\n\n【未確認の点】\n${r.caution}`;
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(lastText); $("status").textContent = "コピーしました。"; }
    catch { $("status").textContent = "コピーできませんでした。結果を選択してコピーしてください。"; }
  };
}

$("sample").onclick = () => { $("src").value = SAMPLE.text; $("status").textContent = "見本を入れました。"; render(SAMPLE.result, true); };
$("clear").onclick = () => { $("src").value = ""; $("note").value = ""; $("out").innerHTML = ""; $("status").textContent = "結果がここに出ます。"; };

let sample = null;
claude.use("sample").then(s => { sample = s; if(!s){ $("go").disabled = true; $("status").textContent = "この画面ではAIによる翻訳が使えません。見本だけ見られます。"; } }).catch(()=>{ $("go").disabled = true; });

$("go").onclick = async () => {
  const text = $("src").value.trim();
  if(!text){ $("status").textContent = "先に原文を貼ってください。"; return; }
  if(!sample){ $("status").textContent = "この画面ではAIによる翻訳が使えません。"; return; }
  $("go").disabled = true; $("out").innerHTML = ""; $("status").textContent = "訳して解説を作っています…";
  const note = $("note").value.trim();
  const prompt = `あなたはAIに詳しくない日本人のビジネスパーソンに向けて、海外のX投稿を解説する編集者です。次の原文(英語や中国語など)を読み、JSONだけを返してください。前置きやコードブロックは付けません。

JSONの形:
{"translation": 自然な日本語訳(全文。固有名詞は原語のまま), "summary": ひとこと(1文), "terms": [{"word": 用語, "meaning": 専門用語を使わない説明}], "why": [何がすごい・大事かを1〜3個], "howto": [初心者が試せる手順を3〜5個。投稿に書かれていない手順は一般的な方法として示す], "caution": 投稿の主張のうち確かめられていない点、数字や肩書きの出どころ、宣伝・釣りの可能性。なければ「特になし」}

決まり:
- 原文に書かれていない事実を作らない。分からないことは「原文からは分からない」と書く
- 「〜と投稿者は言っている」と「確かめられていること」を分ける
- ツールや製品の名前、料金、手順は、原文にあるものだけ事実として書く
- やさしい日本語で、短く
${note ? `- 読者の知りたいこと: ${note}\n` : ""}
原文:
"""
${text.slice(0, 6000)}
"""`;
  try{
    const r = await sample.json(prompt, {cache:false});
    render(r, false);
    $("status").textContent = "できました。";
    saveHistory(text, r);
  }catch(e){
    const code = e && e.code;
    $("status").className = "status err";
    $("status").textContent = code === "not_granted" ? "AIの利用が許可されていません。" : code === "rate_limited" ? "続けて使いすぎました。少し待ってからもう一度押してください。" : "うまく作れませんでした。もう一度押してください。";
  }finally{
    $("go").disabled = false;
    setTimeout(()=>{ $("status").className = "status"; }, 4000);
  }
};

/* 保存: 自分専用の場所(data/users/<自分のid>/history)に1件ずつ残す。使えないときは何も出さない */
let hcol = null;
function when(ts){ const d = new Date(ts); return d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
async function initHistory(){
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    hcol = db.collection("data/users/" + id + "/history");
    $("histPanel").hidden = false;
    hcol.orderBy("ts","desc").limit(30).onSnapshot(snap => {
      const rows = []; snap.forEach(d => rows.push({id:d.id, ...d.data()}));
      const box = $("hist"); box.innerHTML = "";
      if(!rows.length){ box.innerHTML = '<p class="hint">まだありません。訳すと、ここに自動で残ります。</p>'; return; }
      rows.forEach(row => {
        const el = document.createElement("div"); el.className = "hitem";
        const b = document.createElement("button"); b.type = "button"; b.className = "hbody";
        const s = document.createElement("small"); s.textContent = when(row.ts);
        const t = document.createElement("span"); t.textContent = (row.src || "").replace(/\s+/g," ").slice(0,80);
        b.append(s, t);
        b.onclick = () => { $("src").value = row.src || ""; render(row.result, false); $("status").textContent = "保存した結果を表示中です。"; window.scrollTo({top:0,behavior:"smooth"}); };
        const x = document.createElement("button"); x.type = "button"; x.className = "hdel"; x.textContent = "消す";
        x.onclick = () => { if(x.dataset.ask){ hcol.doc(row.id).delete().catch(()=>{}); } else { x.dataset.ask = "1"; x.textContent = "本当に消す"; setTimeout(()=>{ delete x.dataset.ask; x.textContent = "消す"; }, 3000); } };
        el.append(b, x); box.append(el);
      });
    }, () => { $("histPanel").hidden = true; });
  }catch(e){ /* 保存が使えない画面では出さない */ }
}
async function saveHistory(text, r){
  if(!hcol) return;
  try{ await hcol.doc(String(Date.now())).set({ts:Date.now(), src:text.slice(0,6000), result:r}); }catch(e){}
}
initHistory();

render(SAMPLE.result, true);
$("src").value = SAMPLE.text;
$("status").textContent = "見本を表示中です。原文を入れ替えて「訳して解説する」を押してください。";
</script>
