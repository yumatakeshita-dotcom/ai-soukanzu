<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ご購入ありがとうございます | AI企業の相関図 プロ</title>
<style>
:root{--bg:#f2f4f6;--surface:#ffffff;--fg:#161b22;--muted:#5d6875;--line:#d5dbe1;--active:#0d8a79;--conflict:#c93b3b;--font-body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151a;--surface:#1a2027;--fg:#e8edf2;--muted:#9aa6b2;--line:#2b343d;--active:#3ec9b4;--conflict:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.75 var(--font-body);padding:0 16px 48px}
main{max-width:560px;margin:0 auto;padding-top:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
code{display:block;word-break:break-all;font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--active);color:var(--active);background:var(--surface);cursor:pointer}
a{color:var(--active)}.err{color:var(--conflict)}.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
<h1>ご購入ありがとうございます</h1>
<div class="card" id="box">確認しています…</div>
<p class="muted">アクセスキーは、このブラウザに自動で保存されます。ほかの端末で使うときのために、下のキーを控えてください。キーは再発行できないので、紛失したときはご連絡ください。</p>
<p><a href="/">相関図にもどる</a></p>
</main>
<script>
(function(){
  var box=document.getElementById('box');
  var sid=new URLSearchParams(location.search).get('session_id')||'';
  function fail(m){box.innerHTML='<span class="err"></span>';box.firstChild.textContent=m;}
  if(!sid){fail('購入の情報が見つかりません。決済のあとに開かれるページからお越しください。届かないときはご連絡ください。');return;}
  fetch('/api/pro/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:sid})})
   .then(function(r){return r.json()}).then(function(j){
     if(!j||!j.ok){fail(j&&j.error==='not_paid'?'お支払いの確認がまだできていません。少し待ってから、このページを開き直してください。':'キーを表示できませんでした。ご連絡ください。');return;}
     try{localStorage.setItem('pro_key',j.key);}catch(e){}
     box.innerHTML='あなたのアクセスキー<code id="k"></code><button id="c" type="button">コピー</button>';
     document.getElementById('k').textContent=j.key;
     document.getElementById('c').onclick=function(){try{navigator.clipboard.writeText(j.key);this.textContent='コピーしました';}catch(e){}};
   }).catch(function(){fail('つながりませんでした。時間をおいて開き直してください。');});
})();
</script>
</body>
</html>
